name: Release packages

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish protocol and UI packages to npm
        required: true
        type: boolean
        default: false
      publish_pypi:
        description: Publish the Python runtime to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: npm run check:protocol
      - run: npm test
      - run: npm run typecheck
      - run: python -m pip install -e "./backend[dev,release]"
      - run: python -m ruff check backend
      - run: python -m mypy backend/src
      - run: python -m pytest backend/tests
      - run: python -m build backend
      - run: python -m twine check backend/dist/*

  npm:
    if: inputs.publish_npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --workspace @imthekaiwen/agent-protocol --provenance --access public
      - run: npm publish --workspace @imthekaiwen/agent-ui --provenance --access public

  pypi:
    if: inputs.publish_pypi
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kaiwen-agent/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build backend
      - uses: pypa/gh-action-pypi-publish@release/v1
