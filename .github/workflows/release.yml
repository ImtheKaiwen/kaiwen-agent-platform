name: Release packages

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish protocol and UI packages to npm
        required: true
        type: boolean
        default: false
      publish_pypi:
        description: Publish the Python runtime to PyPI
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run build
      - run: npm run check:protocol
      - run: npm test
      - run: npm run typecheck
      - run: python -m pip install -e ".[dev,release]"
        working-directory: backend
      - run: python -m ruff format --check . ../examples
        working-directory: backend
      - run: python -m ruff check . ../examples
        working-directory: backend
      - run: python -m mypy --no-incremental src/kaiwen_agent
        working-directory: backend
      - run: python -m mypy --no-incremental ../examples/simple-runtime/main.py
        working-directory: backend
      - run: python -m mypy --no-incremental ../examples/autonomous-single-agent/main.py
        working-directory: backend
      - run: python -m mypy --no-incremental ../examples/software-agent-team/main.py
        working-directory: backend
      - run: python -m mypy --no-incremental ../examples/speech-pipeline/main.py
        working-directory: backend
      - run: python -m mypy --no-incremental ../examples/validation-consumer/main.py
        working-directory: backend
      - run: python -m mypy --no-incremental ../examples/legal-domain-validation/main.py
        working-directory: backend
      - run: python -m mypy --no-incremental ../examples/coding-kit-fake/main.py
        working-directory: backend
      - run: python -m mypy --no-incremental ../examples/coding-kit-openai/main.py
        working-directory: backend
      - run: python -m pytest
        working-directory: backend
      - run: python ../examples/validation-consumer/main.py "$RUNNER_TEMP/todo-consumer"
        working-directory: backend
      - run: python ../examples/legal-domain-validation/main.py "$RUNNER_TEMP/legal-consumer"
        working-directory: backend
      - run: python -m build
        working-directory: backend
      - run: python -m twine check dist/*
        working-directory: backend

  npm:
    if: inputs.publish_npm
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --workspace @imthekaiwen/agent-protocol --provenance --access public --tag alpha
      - run: npm publish --workspace @imthekaiwen/agent-ui --provenance --access public --tag alpha

  pypi:
    if: inputs.publish_pypi
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kaiwen-agent/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build backend
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist/
