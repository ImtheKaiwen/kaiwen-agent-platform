name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff format --check . ../examples
      - run: python -m ruff check . ../examples
      - run: python -m mypy src/kaiwen_agent
      - run: python -m mypy ../examples/simple-runtime/main.py
      - run: python -m mypy ../examples/autonomous-single-agent/main.py
      - run: python -m mypy ../examples/software-agent-team/main.py
      - run: python -m mypy ../examples/speech-pipeline/main.py
      - run: python -m mypy ../examples/validation-consumer/main.py
      - run: python -m mypy ../examples/legal-domain-validation/main.py
      - run: python -m pytest
      - run: python ../examples/simple-runtime/main.py
      - run: python ../examples/autonomous-single-agent/main.py
      - run: python ../examples/software-agent-team/main.py
      - run: python ../examples/speech-pipeline/main.py
      - run: python ../examples/validation-consumer/main.py "$RUNNER_TEMP/todo-consumer"
      - run: python ../examples/legal-domain-validation/main.py "$RUNNER_TEMP/legal-consumer"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:protocol
      - run: npm test
      - run: npm run typecheck
