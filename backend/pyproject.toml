[build-system]
requires = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name = "kaiwen-agent"
version = "0.3.0a1"
description = "Provider-neutral asynchronous agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kaiwen" }]
keywords = ["agent", "ai", "asyncio", "openai", "tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/ImtheKaiwen/kaiwen-agent-platform"
Documentation = "https://github.com/ImtheKaiwen/kaiwen-agent-platform/tree/main/docs"
Repository = "https://github.com/ImtheKaiwen/kaiwen-agent-platform.git"
Issues = "https://github.com/ImtheKaiwen/kaiwen-agent-platform/issues"

[project.optional-dependencies]
openai = [
  "openai>=2,<3",
]
openai-live = [
  "websockets>=15,<17",
]
dev = [
  "mypy>=1.14,<2",
  "python-dotenv>=1.1,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "openai>=2,<3",
]
release = [
  "build>=1.2,<2",
  "twine>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kaiwen_agent"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kaiwen_agent"]
